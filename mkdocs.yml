# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json
site_name: Omnisolver-Bruteforce
site_author: "Konrad Jałowiecki & Łukasz Pawela"
site_description: "Exhaustive search plugin for Omnisolver"
site_url: https://euro-hpc-pl.github.io/omnisolver-bruteforce/
copyright: ""
theme:
  name: material
  logo: assets/logo.png
  palette:
    primary: custom
  features:
    - navigation.tabs
    - navigation.tracking
extra:
  version:
    provider: mike
extra_css:
  - stylesheets/extra.css
nav:
  - Home: index.md
  - User guide: userguide.md
  - Reference manual:
    - omnisolver.bruteforce.gpu.sampler: reference/omnisolver_bruteforce_sampler.md
    - omnisolver.bruteforce.gpu.distributed: reference/omnisolver_bruteforce_distributed.md
plugins:
  - search
  - mike:
      canonical_version: latest
      version_selector: true
  - termynal:
      prompt_literal_start:
        - "$"
  - mkdocstrings:
      handlers:
        python:
          options:
            annotations_path: brief
            heading_level: 2
            show_source: false
            show_root_toc_entry: false
            show_signature_annotations: true
            members_order: source
            separate_signature: true
            docstring_style: sphinx
            show_if_no_docstring: true
            # These are renderer options; passing them as docstring_options forwards them to
            # the docstring parser, which rejects them and breaks the build.
            ignore_init_summary: true
            merge_init_into_class: true
            show_docstring_returns: true
repo_name: omnisolver-bruteforce
repo_url: https://github.com/euro-hpc-pl/omnisolver-bruteforce
markdown_extensions:
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - tables
  - pymdownx.tabbed:
      alternate_style: true
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
