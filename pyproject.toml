[build-system]
requires = ["setuptools-cuda", "setuptools", "setuptools_scm", "wheel", "cython", "numpy"]
build-backend = "setuptools.build_meta"

[project]
readme = "README.md"
requires-python = ">=3.10"
name = "omnisolver-bruteforce"
description = "Bruteforce (a.k.a. exhaustive search) Plugin for Omnisolver"
license = {file = "LICENSE"}
dependencies = [
    "omnisolver >= 0.0.4",
    "dimod ~= 0.12",
    "numba ~= 0.58",
    "numpy ~= 2.0"
]
dynamic = ["version"]

[project.optional-dependencies]
# Required by DistributedBruteforceGPUSampler, which imports ray at module level.
distributed = [
    "ray >= 2.9",
]
docs = [
    "mkdocs ~= 1.5",
    "mkdocs-material ~= 9.4",
    "mkdocstrings[python] >= 0.24",
    "termynal ~= 0.14",
    "mike ~= 2.0",
]

[project.entry-points."omnisolver"]
bruteforce-gpu = "omnisolver.bruteforce.gpu"

[project.urls]
repository = "https://github.com/euro-hpc-pl/omnisolver-bruteforce"
documentation = "https://euro-hpc-pl.github.io/omnisolver-bruteforce"

[tool.pytest.ini_options]
markers = [
    "slow: tests running an exhaustive search large enough to take minutes (N >= 40)",
]

[tool.setuptools_scm]

[tool.setuptools.packages]
find = {exclude=["instances"]}

[tool.black]
line-length = 100
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.venv
)/
'''
