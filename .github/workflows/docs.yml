name: Publish documentation

# The reference manual is generated by mkdocstrings, which imports
# omnisolver.bruteforce and therefore the compiled CUDA extension. The docs consequently
# have to be built where the package can be installed, i.e. on the CUDA-capable
# self-hosted runner, which is also why they are not built on Read the Docs.
on:
  push:
    branches: [master, main]
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish_docs:
    runs-on: [self-hosted,gpu]
    steps:
      - uses: Jimver/cuda-toolkit@v0.2.20
        with:
          cuda: '12.5.0'
          log-file-suffix: 'docs.txt'
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install package and documentation toolchain
        run: |
          pip install ".[docs]"
      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Deploy tagged version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mike deploy --push --update-aliases "${GITHUB_REF#refs/tags/}" latest
          mike set-default --push latest
      - name: Deploy development version
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: |
          mike deploy --push dev
